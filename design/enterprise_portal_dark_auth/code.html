<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GrievanceGrid | Auth Gateway</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Noto+Serif+Devanagari:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed": "#fddf9d",
                        "on-error": "#690005",
                        "on-surface-variant": "#d9c2b2",
                        "surface-variant": "#492c39",
                        "primary-fixed-dim": "#ffb77a",
                        "outline-variant": "#534437",
                        "on-primary": "#4c2700",
                        "on-secondary-container": "#ffb08e",
                        "on-tertiary": "#3e2e00",
                        "primary-fixed": "#ffdcc2",
                        "on-secondary-fixed-variant": "#7c2e00",
                        "on-primary-fixed": "#2e1500",
                        "on-secondary-fixed": "#360f00",
                        "on-secondary": "#581e00",
                        "on-tertiary-fixed-variant": "#574411",
                        "secondary": "#ffb596",
                        "surface-tint": "#ffb77a",
                        "on-tertiary-container": "#5b4714",
                        "on-primary-fixed-variant": "#6d3a00",
                        "inverse-on-surface": "#442835",
                        "inverse-surface": "#ffd8e7",
                        "on-background": "#ffd8e7",
                        "tertiary-container": "#d3b778",
                        "outline": "#a18d7e",
                        "primary-container": "#ffa552",
                        "surface-dim": "#230b18",
                        "secondary-container": "#8c3400",
                        "secondary-fixed": "#ffdbcd",
                        "surface-bright": "#4e303e",
                        "background": "#230b18",
                        "inverse-primary": "#8f4e00",
                        "error-container": "#93000a",
                        "on-tertiary-fixed": "#251a00",
                        "secondary-fixed-dim": "#ffb596",
                        "error": "#ffb4ab",
                        "on-primary-container": "#713c00",
                        "surface-container-high": "#3d212f",
                        "surface-container-low": "#2d1320",
                        "surface": "#230b18",
                        "surface-container": "#311724",
                        "surface-container-lowest": "#1d0612",
                        "on-surface": "#ffd8e7",
                        "on-error-container": "#ffdad6",
                        "primary": "#ffcba2",
                        "surface-container-highest": "#492c39",
                        "tertiary": "#f0d291",
                        "tertiary-fixed-dim": "#e0c384"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"],
                        "devanagari": ["Noto Serif Devanagari"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        body {
            background-color: #230b18; /* surface-dim */
            background-image: radial-gradient(circle at 50% 50%, #381d2a 0%, #230b18 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .fine-line-input {
            border-bottom: 1px solid rgba(83, 68, 55, 0.3); /* outline-variant 30% */
        }
        .fine-line-input:focus {
            border-bottom: 2px solid #ffa552; /* primary-container */
            outline: none;
        }
        .devanagari-calligraphy {
            text-shadow: 0 0 12px rgba(240, 210, 145, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 font-body text-on-surface-variant selection:bg-primary-container selection:text-on-primary-container">
<main class="w-full max-w-[480px] relative">
<!-- Brand Identity Section -->
<div class="text-center mb-10">
<h2 class="devanagari-calligraphy font-devanagari text-3xl md:text-4xl text-tertiary mb-3 tracking-wide">
                तमसो मा ज्योतिर्गमय
            </h2>
<div class="flex items-center justify-center gap-2">
<span class="h-[1px] w-8 bg-outline-variant/30"></span>
<span class="text-xs font-label uppercase tracking-[0.2em] text-on-surface-variant/60">Enterprise Secure Access</span>
<span class="h-[1px] w-8 bg-outline-variant/30"></span>
</div>
</div>
<!-- Auth Modal -->
<div class="bg-surface-variant/40 backdrop-blur-xl rounded-xl shadow-[0_0_40px_rgba(35,11,24,0.5)] border border-outline-variant/15 overflow-hidden">
<!-- Tab Navigation -->
<div class="flex border-b border-outline-variant/10">
<button class="flex-1 py-5 text-sm font-label uppercase tracking-widest text-primary border-b-2 border-primary transition-colors">
                    Login
                </button>
<button class="flex-1 py-5 text-sm font-label uppercase tracking-widest text-on-surface-variant/40 hover:text-on-surface-variant/70 transition-colors">
                    Signup
                </button>
</div>
<div class="p-8 md:p-10">
<!-- Social Login -->
<button class="w-full h-12 flex items-center justify-center gap-3 bg-white hover:bg-white/90 text-background font-medium rounded-lg transition-all active:scale-[0.98]">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
<div class="relative my-10 text-center">
<span aria-hidden="true" class="absolute inset-0 flex items-center">
<span class="w-full border-t border-outline-variant/10"></span>
</span>
<span class="relative bg-surface-variant/0 px-4 text-xs font-label uppercase tracking-widest text-on-surface-variant/40">
                        Or standard entry
                    </span>
</div>
<!-- Form -->
<form action="#" class="space-y-8">
<div class="space-y-2 group">
<label class="text-[10px] font-label uppercase tracking-widest text-tertiary/70 group-focus-within:text-primary transition-colors" for="email">
                            Identifier / Email
                        </label>
<div class="relative">
<input class="w-full bg-transparent py-2 fine-line-input text-on-surface placeholder:text-on-surface-variant/20 transition-all" id="email" name="email" placeholder="admin@grievancegrid.gov" type="email"/>
</div>
</div>
<div class="space-y-2 group">
<div class="flex justify-between items-end">
<label class="text-[10px] font-label uppercase tracking-widest text-tertiary/70 group-focus-within:text-primary transition-colors" for="password">
                                Security Key
                            </label>
<a class="text-[10px] font-label uppercase tracking-widest text-on-surface-variant/40 hover:text-primary-container transition-colors" href="#">
                                Recovery?
                            </a>
</div>
<div class="relative">
<input class="w-full bg-transparent py-2 fine-line-input text-on-surface placeholder:text-on-surface-variant/20 transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-4">
<button class="group relative w-full h-12 bg-gradient-to-r from-primary to-primary-container rounded-lg font-label uppercase tracking-widest text-on-primary font-bold shadow-[0_0_24px_rgba(255,165,82,0.15)] hover:shadow-[0_0_32px_rgba(255,165,82,0.25)] transition-all active:scale-[0.98] overflow-hidden" type="submit">
<span class="relative z-10">Initialize Portal</span>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>
</form>
<!-- System Metadata -->
<div class="mt-10 pt-8 border-t border-outline-variant/5 flex flex-col gap-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[16px] text-tertiary-fixed">verified_user</span>
<p class="text-[10px] font-label uppercase tracking-tight text-on-surface-variant/50">
                            AES-256 Multi-tenant Encryption Active
                        </p>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[16px] text-tertiary-fixed">dns</span>
<p class="text-[10px] font-label uppercase tracking-tight text-on-surface-variant/50">
                            Node: Secure-Gateway-Lambda-04
                        </p>
</div>
</div>
</div>
</div>
<!-- Footer Links -->
<div class="mt-8 flex justify-center gap-8">
<a class="text-[10px] font-label uppercase tracking-widest text-on-surface-variant/30 hover:text-tertiary transition-colors" href="#">Regulatory Compliance</a>
<a class="text-[10px] font-label uppercase tracking-widest text-on-surface-variant/30 hover:text-tertiary transition-colors" href="#">Audit Logs</a>
<a class="text-[10px] font-label uppercase tracking-widest text-on-surface-variant/30 hover:text-tertiary transition-colors" href="#">Contact Ops</a>
</div>
</main>
<!-- Decorative Background Elements -->
<div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
<div class="absolute top-[-10%] right-[-5%] w-[400px] h-[400px] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[300px] h-[300px] bg-tertiary/5 blur-[100px] rounded-full"></div>
<!-- Grid Pattern Overlay -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: linear-gradient(#534437 1px, transparent 1px), linear-gradient(90deg, #534437 1px, transparent 1px); background-size: 60px 60px;">
</div>
</div>
</body></html>
