[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grievancegrid-api"
version = "0.1.0"
description = "FastAPI backend for GrievanceGrid"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.103.1",
  "uvicorn>=0.23.2",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "sqlalchemy>=2.0.41",
  "asyncpg>=0.30.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "redis>=5.0.0",
  "celery>=5.4.0",
  "httpx>=0.24.1",
]

[tool.setuptools.packages.find]
where = ["src"]
