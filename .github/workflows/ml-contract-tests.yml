name: ML Contract Tests

on:
  push:
    paths:
      - 'ai-models/**'
      - '.github/workflows/ml-contract-tests.yml'
  pull_request:
    paths:
      - 'ai-models/**'
      - '.github/workflows/ml-contract-tests.yml'
  workflow_dispatch:

jobs:
  ml-contract-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx python-multipart

      - name: Run ML API contract tests
        run: |
          pytest ai-models/tests/test_ml_api_contracts.py -q
