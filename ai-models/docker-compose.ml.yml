version: '3.8'

services:
  llm-service:
    build:
      context: .
      dockerfile: llm/Dockerfile
    container_name: grievance-llm
    env_file:
      - .env
    ports:
      - "${LLM_SERVICE_PORT:-8001}:8000"
    volumes:
      - ./models:/app/models
    networks:
      - grievance_network
    restart: unless-stopped

  cv-service:
    build:
      context: .
      dockerfile: cv/Dockerfile
    container_name: grievance-cv
    env_file:
      - .env
    ports:
      - "${CV_SERVICE_PORT:-8002}:8000"
    volumes:
      - ./models:/app/models
    networks:
      - grievance_network
    restart: unless-stopped

  gnn-service:
    build:
      context: .
      dockerfile: gnn/Dockerfile
    container_name: grievance-gnn
    env_file:
      - .env
    ports:
      - "${GNN_SERVICE_PORT:-8003}:8000"
    volumes:
      - ./models:/app/models
    networks:
      - grievance_network
    restart: unless-stopped

networks:
  grievance_network:
    driver: bridge

volumes:
  models:
    driver: local
